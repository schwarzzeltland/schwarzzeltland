<div class="d-flex align-items-center gap-1 mb-1"><label class="mb-0"><input class="form-check-input packing-checkbox me-1" type="checkbox" data-amount="{{ storage.available_quantity }}" hx-post="{% url 'change_packed_stock_material' %}" hx-vals='js:{"trip_id":"{{ trip.pk }}","stock_material_id":"{{ storage.stock_material_id }}","packed":event.target.checked}' hx-swap="none" {% if storage.packed %}checked{% endif %} {% if not is_event_manager %}disabled{% endif %}>{{ storage.storage_place }}: {{ storage.available_quantity }} Stück</label>{% if storage.storage_area_id %}<a class="btn btn-sm btn-outline-warning d-inline-flex align-items-center justify-content-center" style="min-width:0;width:1.65rem;height:1.65rem;padding:0" href="{% url 'storage_plan_show' storage.storage_plan_id %}?area={{ storage.storage_area_id }}" title="Auf Lagerplan anzeigen"><i class="bi bi-map"></i><span class="visually-hidden">Auf Lagerplan anzeigen</span></a>{% endif %}</div>
