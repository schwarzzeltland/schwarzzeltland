{% extends "base.html" %}{% load bootstrap5 %}
{% block content %}<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"><h3>QR-Codes für Materialkisten</h3><p class="text-muted">Wähle die Kisten und anschließend den gewünschten Umfang der Etiketten.</p><form method="post">{% csrf_token %}<div class="d-flex gap-2 mb-2"><button type="button" class="btn btn-sm btn-outline-secondary" id="select-all-containers">Alle Kisten auswählen</button><button type="button" class="btn btn-sm btn-outline-secondary" id="clear-containers">Auswahl aufheben</button></div>{% bootstrap_form form %}<button class="btn btn-primary">PDF erstellen</button> <a class="btn btn-secondary" href="{% url 'material_container_list' %}">Abbrechen</a></form><script src="https://code.jquery.com/jquery-3.6.0.min.js"></script><script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script><script>$(function(){const select=$('.select2-containers');select.select2({width:'100%',placeholder:'Materialkisten suchen und auswählen',closeOnSelect:false});$('#select-all-containers').on('click',function(){select.find('option').prop('selected',true);select.trigger('change');});$('#clear-containers').on('click',function(){select.val(null).trigger('change');});});</script>{% endblock %}
