{% extends "base.html" %}{% load bootstrap5 %}
{% block content %}<h3>Auszahlungsanfrage prüfen</h3><dl class="row"><dt class="col-sm-3">Auslage</dt><dd class="col-sm-9">{{ reimbursement.title }}</dd><dt class="col-sm-3">Betrag</dt><dd class="col-sm-9">{{ reimbursement.amount }} {{ reimbursement.cashbook.currency }}</dd><dt class="col-sm-3">Beleg</dt><dd class="col-sm-9"><a href="{{ reimbursement.attachment.url }}" target="_blank">Beleg öffnen</a></dd></dl><form method="post">{% csrf_token %}{% bootstrap_form form %}<button class="btn btn-primary">Entscheidung speichern</button></form>{% endblock %}
