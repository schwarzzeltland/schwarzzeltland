{% extends "base.html" %}{% load bootstrap5 %}
{% block content %}<h3>Auszahlungsanfrage stellen</h3><form method="post" enctype="multipart/form-data">{% csrf_token %}{% bootstrap_form form %}<button class="btn btn-primary">Einreichen</button> <a class="btn btn-secondary" href="{% url 'reimbursement_list' %}">Abbrechen</a></form>{{ bank_cashbook_ids|json_script:"bank-cashbook-ids" }}<script>document.addEventListener('DOMContentLoaded',function(){const ids=new Set(JSON.parse(document.getElementById('bank-cashbook-ids').textContent).map(String));const cashbook=document.getElementById('id_cashbook');const fields=['id_recipient_name','id_recipient_iban','id_recipient_bic'].map(id=>document.getElementById(id));function updateBankFields(){const required=ids.has(cashbook.value);fields.forEach(field=>{if(!field)return;field.required=required;const wrapper=field.closest('.mb-3');if(wrapper)wrapper.style.display=required?'':'none';});}cashbook?.addEventListener('change',updateBankFields);updateBankFields();});</script>{% endblock %}
