{% extends 'base.html' %}
{% load bootstrap5 %}
{% block content %}
<h2>{% if group %}Teilnehmergruppe bearbeiten{% else %}Teilnehmergruppe hinzufügen{% endif %}</h2>
<p class="text-muted">{{ trip.name }}</p>
<form method="post" class="card card-body">{% csrf_token %}{% bootstrap_form form %}<button class="btn btn-primary">Speichern</button><a href="{% url 'calculation_detail' trip.pk %}" class="btn btn-outline-secondary mt-2">Zurück zur Kalkulation</a></form>
{% endblock %}
